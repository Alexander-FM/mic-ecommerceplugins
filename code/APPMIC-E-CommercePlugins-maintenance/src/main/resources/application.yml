server:
  port: ${PORT:9090}
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${LB_AUTH_JWK_URI:http://127.0.0.1:9000/oauth2/jwks}
  application:
    name: appmic-e-commerceplugins-maintenance
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: "jdbc:mysql://${DB_HOST:127.0.0.1:3306}/${DB_DATABASE:maintenance_service}?createDatabaseIfNotExist=true"
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  cloud:
    kubernetes:
      secrets:
        enable-api: true
      discovery:
        all-namespaces: true
maintenance:
  drive:
    credentials: /credentials.json
logging:
  level:
    "org.springframework.security": DEBUG
    "org.springframework.security.oauth2": DEBUG
    "org.springframework.security.oauth2.server.authorization": DEBUG
app:
  endpoints:
    customer: "/api/maintenance/customers"
    employee: "/api/maintenance/employees"
    role: "/api/maintenance/roles"
    user: "/api/maintenance/users"
    brand: "/api/maintenance/brands"
    category: "/api/maintenance/categories"
    product: "/api/maintenance/products"
    product-attribute: "/api/maintenance/products/attributes"
    product-image: "/api/maintenance/products/images"
    google-drive: "/api/maintenance/google-drive/images"

# Configuration Dev
---
spring:
  config:
    activate:
      on-profile: dev
config:
  texto: Configurando ambiente de desarrollo
# Configuration Prod
---
spring:
  config:
    activate:
      on-profile: prod
config:
  texto: Configurando ambiente de produccion