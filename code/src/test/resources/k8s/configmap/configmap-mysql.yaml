apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init-scripts
  namespace: dev
data:
  init-schemas.sql: |
    CREATE
    DATABASE IF NOT EXISTS maintenance_service;
    CREATE
    DATABASE IF NOT EXISTS orders_service;

    -- Crear la tabla de estados de orden
    CREATE TABLE IF NOT EXISTS orders_service.order_status
    (
        id
        INT
        NOT
        NULL
        AUTO_INCREMENT,
        is_active
        BOOLEAN
        NOT
        NULL
        DEFAULT
        true,
        status_name
        VARCHAR
    (
        100
    ) NOT NULL,
        CONSTRAINT pk_order_status PRIMARY KEY
    (
        id
    )
        );

    -- Crear la tabla de categorías
    CREATE TABLE IF NOT EXISTS maintenance_service.categories
    (
        id
        INT
        NOT
        NULL
        AUTO_INCREMENT,
        description
        VARCHAR
    (
        100
    ) NOT NULL,
        is_active BOOLEAN NOT NULL DEFAULT true,
        parent_category INT,
        CONSTRAINT pk_category PRIMARY KEY
    (
        id
    )
        );

    -- Crear la tabla de marcas
    CREATE TABLE IF NOT EXISTS maintenance_service.brands
    (
        id
        INT
        NOT
        NULL
        AUTO_INCREMENT,
        description
        VARCHAR
    (
        100
    ) NOT NULL,
        is_active BOOLEAN NOT NULL DEFAULT true,
        CONSTRAINT pk_brand PRIMARY KEY
    (
        id
    )
        );

    -- Crear la tabla de roles
    CREATE TABLE IF NOT EXISTS maintenance_service.roles
    (
        id
        INT
        NOT
        NULL
        AUTO_INCREMENT,
        description
        VARCHAR
    (
        100
    ) NOT NULL,
        is_active BOOLEAN NOT NULL DEFAULT true,
        CONSTRAINT pk_roles PRIMARY KEY
    (
        id
    )
        );

    -- Crear tablas atributos
    CREATE TABLE IF NOT EXISTS maintenance_service.attributes
    (
        id
        INT
        NOT
        NULL
        AUTO_INCREMENT,
        name
        VARCHAR
    (
        255
    ) NOT NULL,
        CONSTRAINT pk_attributes PRIMARY KEY
    (
        id
    )
        );

    -- Crear la tabla de productos
    CREATE TABLE IF NOT EXISTS maintenance_service.products
    (
        id
        INT
        NOT
        NULL
        AUTO_INCREMENT,
        bar_code
        VARCHAR
    (
        255
    ),
        description VARCHAR
    (
        15000
    ),
        is_active BOOLEAN,
        is_recommended BOOLEAN,
        main_image_url VARCHAR
    (
        255
    ),
        name VARCHAR
    (
        255
    ),
        price DOUBLE,
        stock INT,
        brand_id INT,
        category_id INT,
        CONSTRAINT pk_products PRIMARY KEY
    (
        id
    ),
        CONSTRAINT FK_Products_Brands FOREIGN KEY
    (
        brand_id
    ) REFERENCES maintenance_service.brands
    (
        id
    ),
        CONSTRAINT FK_Products_Categories FOREIGN KEY
    (
        category_id
    ) REFERENCES maintenance_service.categories
    (
        id
    )
        );

    -- Crear la tabla de valores de atributos de productos
    CREATE TABLE IF NOT EXISTS maintenance_service.product_attributes
    (
        id
        INT
        NOT
        NULL
        AUTO_INCREMENT,
        value
        VARCHAR
    (
        100
    ) NOT NULL,
        attribute_id INT NOT NULL,
        product_id INT NOT NULL,
        CONSTRAINT pk_product_attribute PRIMARY KEY
    (
        id
    ),
        CONSTRAINT FK_ProductsAttribute_Products FOREIGN KEY
    (
        product_id
    ) REFERENCES maintenance_service.products
    (
        id
    )
        );

    -- Crear la tabla de imágenes de productos
    CREATE TABLE IF NOT EXISTS maintenance_service.product_images
    (
        id
        INT
        NOT
        NULL
        AUTO_INCREMENT,
        image_url
        VARCHAR
    (
        255
    ) NOT NULL,
        product_id INT NOT NULL,
        CONSTRAINT pk_product_images PRIMARY KEY
    (
        id
    ),
        CONSTRAINT FK_ProductsImages_Products FOREIGN KEY
    (
        product_id
    ) REFERENCES maintenance_service.products
    (
        id
    )
        );

