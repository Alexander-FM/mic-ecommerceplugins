        (5, 'Capacidad de la Batería'),
        (6, 'Sistema Operativo'),
        (7, 'Resolución de Cámara Principal'),
        (8, 'Conectividad (5G/4G/Wi-Fi)'),
        
        -- Categoría: Vinos
        (9, 'Tipo de Vino (Tinto/Blanco/Rosado)'),
        (10, 'Bodega'),
        (11, 'Variedad de Uva (Malbec/Cabernet/etc)'),
        (12, 'Año de Cosecha / Añada'),
        (13, 'Región de Origen'),
        (14, 'Graduación Alcohólica'),
        (15, 'Volumen (750ml/1L)'),
        
        -- Categoría: Bazar
        (16, 'Material (Vidrio/Cerámica/Plástico)'),
