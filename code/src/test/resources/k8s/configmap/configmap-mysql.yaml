apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init-scripts
  namespace: dev
data:
  init-schemas.sql: |
    CREATE DATABASE IF NOT EXISTS maintenance_service;
    CREATE DATABASE IF NOT EXISTS orders_service;
  
    
    -- Crear la tabla de estados de orden
    CREATE TABLE IF NOT EXISTS orders_service.order_status (
    id INT NOT NULL,
    is_active BOOLEAN NOT NULL DEFAULT true,
    status_name VARCHAR(100) NOT NULL,
    CONSTRAINT pk_order_status PRIMARY KEY (id)
    );
    
    -- Crear la tabla de roles
    CREATE TABLE IF NOT EXISTS maintenance_service.roles (
    id INT NOT NULL,
    description VARCHAR(100) NOT NULL,
    is_active BOOLEAN NOT NULL DEFAULT true,
    CONSTRAINT pk_roles PRIMARY KEY (id)
    );
    
  
    INSERT INTO orders_service.order_status (id, is_active, status_name)
      VALUES (1, true, 'Pendiente'),
             (2, true, 'Recepcionado'),
             (3, true, 'Preparando pedido'),
             (4, true, 'En camino'),
             (5, true, 'Entregado'),
             (6, true, 'Cancelado');
    
    INSERT INTO maintenance_service.roles (id, description, is_active) VALUES
    (1, 'ADMIN', true),
    (2, 'USER', true);