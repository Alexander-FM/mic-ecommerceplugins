apiVersion: apps/v1
kind: Deployment
metadata:
  name: appmic-e-commerceplugins-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      role: appmic-e-commerceplugins-auth
  template:
    metadata:
      labels:
        role: appmic-e-commerceplugins-auth
    spec:
      containers:
        - image: alexanderpe/appmic-e-commerceplugins-auth:latest
          name: appmic-e-commerceplugins-auth
          imagePullPolicy: Always
          ports:
            - containerPort: 9000
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: appmic-e-commerceplugins-auth
                  key: profile_active
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: appmic-e-commerceplugins-auth
                  key: port
            - name: MS_MAINTENANCE
              valueFrom:
                configMapKeyRef:
                  name: appmic-e-commerceplugins-auth
                  key: lb_maintenance_service
            - name: SPA_REDIRECT_URI
              valueFrom:
                configMapKeyRef:
                  name: appmic-e-commerceplugins-auth
                  key: spa_redirect_uri
---
apiVersion: v1
kind: Service
metadata:
  name: appmic-e-commerceplugins-auth
spec:
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 9000
      targetPort: 9000
  selector:
    role: appmic-e-commerceplugins-auth