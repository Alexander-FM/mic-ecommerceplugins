apiVersion: apps/v1
kind: Deployment
metadata:
  name: quotation-frontend
  namespace: dev
  labels:
    app: quotation-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quotation-frontend
  template:
    metadata:
      labels:
        app: quotation-frontend
    spec:
      containers:
        - name: frontend
          image: alexanderpe/quotation-frontend:latest
          imagePullPolicy: Always # Asegura que tome tu cambio manual o de CI/CD
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi" # Muy ligero porque es solo Nginx sirviendo estáticos
---
apiVersion: v1
kind: Service
metadata:
  name: quotation-frontend
  namespace: dev
spec:
  type: LoadBalancer # En Minikube usaremos 'minikube service'
  selector:
    app: quotation-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80