version: "3.9"

services:
  mysql:
    image: mysql:9.2.0
    container_name: mysql
    networks:
      - ecommerce-net
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: maintenance_service
    volumes:
      - mysql-data:/var/lib/mysql
      - ./config/mysql-init-schemas.sql:/docker-entrypoint-initdb.d/01-init-schemas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot_password --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  appmic-e-commerceplugins-auth:
    image: alexanderpe/appmic-e-commerceplugins-auth:latest
    container_name: appmic-e-commerceplugins-auth
    networks:
      - ecommerce-net
    ports:
      - "9000:9000"
    environment:
      PORT: "9000"
      SPRING_PROFILES_ACTIVE: dev
      LB_AUTH_SERVICE: http://appmic-e-commerceplugins-auth:9000
      MS_MAINTENANCE: http://appmic-e-commerceplugins-maintenance:9090
      FRONTEND_URL: http://localhost:4200
      SPA_REDIRECT_URI: http://localhost:4200/auth/callback
      SPRING_CLOUD_KUBERNETES_ENABLED: "false"
      SPRING_CLOUD_KUBERNETES_CONFIG_ENABLED: "false"
      SPRING_CLOUD_KUBERNETES_DISCOVERY_ENABLED: "false"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  appmic-e-commerceplugins-maintenance:
    image: alexanderpe/appmic-e-commerceplugins-maintenance:latest
    container_name: appmic-e-commerceplugins-maintenance
    networks:
      - ecommerce-net
    ports:
      - "9090:9090"
    environment:
      PORT: "9090"
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: mysql:3306
      DB_DATABASE: maintenance_service
      DB_USERNAME: root
      DB_PASSWORD: root_password
      LB_AUTH_JWK_URI: http://appmic-e-commerceplugins-auth:9000/oauth2/jwks
      GOOGLE_APPLICATION_CREDENTIALS: /credentials.json
      SPRING_CLOUD_KUBERNETES_ENABLED: "false"
      SPRING_CLOUD_KUBERNETES_CONFIG_ENABLED: "false"
      SPRING_CLOUD_KUBERNETES_DISCOVERY_ENABLED: "false"
    volumes:
      - ./secrets/google-drive-credentials.json:/credentials.json:ro
    depends_on:
      mysql:
        condition: service_healthy
      appmic-e-commerceplugins-auth:
        condition: service_started
    restart: unless-stopped

  appmic-e-commerceplugins-orders:
    image: alexanderpe/appmic-e-commerceplugins-orders:latest
    container_name: appmic-e-commerceplugins-orders
    networks:
      - ecommerce-net
    ports:
      - "9091:9091"
    environment:
      PORT: "9091"
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: mysql:3306
      DB_DATABASE: orders_service
      DB_USERNAME: root
      DB_PASSWORD: root_password
      LB_AUTH_JWK_URI: http://appmic-e-commerceplugins-auth:9000/oauth2/jwks
      MS_MAINTENANCE_SERVICE_PORT: http://appmic-e-commerceplugins-maintenance:9090
      SPRING_CLOUD_KUBERNETES_ENABLED: "false"
      SPRING_CLOUD_KUBERNETES_CONFIG_ENABLED: "false"
      SPRING_CLOUD_KUBERNETES_DISCOVERY_ENABLED: "false"
    depends_on:
      mysql:
        condition: service_healthy
      appmic-e-commerceplugins-auth:
        condition: service_started
      appmic-e-commerceplugins-maintenance:
        condition: service_started
    restart: unless-stopped

  appmic-e-commerceplugins-gateway:
    image: alexanderpe/appmic-e-commerceplugins-gateway:latest
    container_name: appmic-e-commerceplugins-gateway
    networks:
      - ecommerce-net
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      SPRING_PROFILES_ACTIVE: dev
      LB_AUTH_SERVICE: http://appmic-e-commerceplugins-auth:9000
      LB_ORDER_SERVICE: http://appmic-e-commerceplugins-orders:9091
      LB_MAINTENANCE_SERVICE: http://appmic-e-commerceplugins-maintenance:9090
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:4200,http://localhost
      SPRING_CLOUD_KUBERNETES_ENABLED: "false"
      SPRING_CLOUD_KUBERNETES_CONFIG_ENABLED: "false"
      SPRING_CLOUD_KUBERNETES_DISCOVERY_ENABLED: "false"
    depends_on:
      appmic-e-commerceplugins-auth:
        condition: service_started
      appmic-e-commerceplugins-maintenance:
        condition: service_started
      appmic-e-commerceplugins-orders:
        condition: service_started
    restart: unless-stopped

networks:
  ecommerce-net:
    driver: bridge

volumes:
  mysql-data:

