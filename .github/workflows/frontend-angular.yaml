name: CI/CD Frontend Angular Service

on:
  push:
    branches: [ "master", "develop" ]
    paths:
      # Ajusta esta ruta a la ubicación real de tu carpeta de Angular
      - 'ecommerce-frontend-angular19/**' 
  workflow_dispatch:

env:
  IMAGE_NAME: alexanderpe/ecommerce-frontend
  SERVICE_PATH: ecommerce-frontend-angular19

jobs:
  # ------------------------------------------------------------------
  # JOB 1: QUALITY GATE (Lint y Build Check)
  # ------------------------------------------------------------------
  build-check:
    name: Build Check and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./${{ env.SERVICE_PATH }}/package-lock.json

      - name: Install dependencies
        working-directory: ./${{ env.SERVICE_PATH }}
        run: npm install

      - name: Build Angular App
        working-directory: ./${{ env.SERVICE_PATH }}
        run: npm run build -- --configuration production

  # ------------------------------------------------------------------
  # JOB 2: DELIVERY (Construcción y Despliegue de Imagen)
  # ------------------------------------------------------------------
  build-and-push:
    name: Build and Push Docker Image
    needs: build-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ env.SERVICE_PATH }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}