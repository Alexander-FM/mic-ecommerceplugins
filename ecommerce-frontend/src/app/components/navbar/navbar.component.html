<div class="navbar">
  <p-toast></p-toast>
  <p-toolbar class="toolbar-container">
    <div class="p-toolbar-group-left">
      <h2 class="app-title" (click)="onCategorySelect(null)" style="cursor: pointer;">E-Commerce</h2>

      <div class="category-selector" *ngIf="categoryMenuItems.length > 0">
        <p-tieredMenu #categoryMenu [model]="categoryMenuItems" [popup]="true"></p-tieredMenu>
        <p-button
          label="Categorías"
          icon="pi pi-th-large"
          (onClick)="categoryMenu.toggle($event)"
          [text]="true"
          styleClass="navbar-category-btn"
        ></p-button>
      </div>
    </div>

    <div class="p-toolbar-group-right">
      <div class="admin-section" *ngIf="isAdmin">
        <p-button label="📦 Registrar Producto" icon="pi pi-plus" (onClick)="navigateToAddProduct()"
          styleClass="p-button-warning" [text]="false"></p-button>
      </div>

      <div class="user-section">
        <p-button *ngIf="userName !== 'Usuario' && ordersCount > 0" label="Mis Compras" icon="pi pi-shopping-bag"
          [text]="true" severity="secondary" (onClick)="navigateToMyOrders()" [badge]="ordersCount.toString()"
          badgeClass="p-badge-info" styleClass="mr-2"></p-button>
        <p-button *ngIf="userName !== 'Usuario' && ordersCount === 0" label="Mis Compras" icon="pi pi-shopping-bag"
          [text]="true" severity="secondary" (onClick)="navigateToMyOrders()" styleClass="mr-2"></p-button>

        <span class="user-name">{{ userName }}</span>
        <p-menu [model]="items" [popup]="true" #menu></p-menu>
        <p-button icon="pi pi-user" (onClick)="menu.toggle($event)" [rounded]="true" [text]="true"
          severity="secondary"></p-button>
      </div>
    </div>
  </p-toolbar>
</div>
