<div class="navbar">
  <p-toast></p-toast>
  <p-toolbar class="toolbar-container">
    <div class="p-toolbar-group-left">
      <h2 class="app-title">E-Commerce</h2>
    </div>

    <div class="p-toolbar-group-right">
      <div class="admin-section" *ngIf="isAdmin">
        <p-button
          label="📦 Registrar Producto"
          icon="pi pi-plus"
          (onClick)="navigateToAddProduct()"
          styleClass="p-button-warning"
          [text]="false"
        ></p-button>
      </div>

      <div class="user-section">
        <span class="user-name">{{ userName }}</span>
        <p-menu [model]="items" [popup]="true" #menu></p-menu>
        <p-button
          icon="pi pi-user"
          (onClick)="menu.toggle($event)"
          [rounded]="true"
          [text]="true"
          severity="secondary"
        ></p-button>
      </div>
    </div>
  </p-toolbar>
</div>
