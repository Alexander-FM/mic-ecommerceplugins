<div class="maintenance-page">
  <p-card header="Mantenimiento de Productos" subheader="Gestión administrativa de productos">
    <p>
      Desde esta pantalla puedes registrar nuevos productos y, en próximos requisitos,
      administrar su edición y eliminación.
    </p>

    <div class="actions">
      <p-button
        label="Registrar producto"
        icon="pi pi-plus"
        (onClick)="goToAddProduct()"
      ></p-button>
    </div>
  </p-card>
</div>
