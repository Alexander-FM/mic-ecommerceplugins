<div class="maintenance-container">
  <p-toast></p-toast>
  <p-confirmDialog></p-confirmDialog>

  <div class="maintenance-header">
    <h2>Gestión de Marcas</h2>
    <p>Registra, edita, activa/inactiva y elimina marcas</p>
  </div>

  <div class="maintenance-form-card">
    <h3>{{ isEditMode ? 'Editar marca' : 'Registrar marca' }}</h3>

    <form [formGroup]="brandForm" class="brand-form" (ngSubmit)="onSubmit()">
      <div class="form-row">
        <div class="form-group">
          <label for="description">Descripción *</label>
          <input
            id="description"
            pInputText
            formControlName="description"
            placeholder="Ej: Riccadonna"
          />
          <small class="text-danger" *ngIf="brandForm.get('description')?.invalid && brandForm.get('description')?.touched">
            Debe tener entre 2 y 50 caracteres
          </small>
        </div>

        <div class="form-group checkbox-group">
          <p-checkbox formControlName="isActive" [binary]="true" label="Activa"></p-checkbox>
        </div>
      </div>

      <div class="button-group">
        <p-button
          type="submit"
          [label]="isEditMode ? 'Actualizar' : 'Registrar'"
          icon="pi pi-save"
          [loading]="isSubmitting"
        ></p-button>

        <p-button
          *ngIf="isEditMode"
          type="button"
          label="Cancelar"
          icon="pi pi-times"
          severity="secondary"
          (onClick)="onCancelEdit()"
        ></p-button>
      </div>
    </form>
  </div>

  <div class="maintenance-table-card">
    <h3>Listado de marcas</h3>

    <p-table [value]="brands" [loading]="isLoading" [paginator]="true" [rows]="10" responsiveLayout="scroll">
      <ng-template pTemplate="header">
        <tr>
          <th>ID</th>
          <th>Descripción</th>
          <th>Estado</th>
          <th style="width: 220px">Acciones</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-brand>
        <tr>
          <td>{{ brand.id }}</td>
          <td>{{ brand.description }}</td>
          <td>
            <p-tag [value]="brand.isActive ? 'Activa' : 'Inactiva'" [severity]="brand.isActive ? 'success' : 'danger'"></p-tag>
          </td>
          <td>
            <div class="table-actions">
              <p-button
                icon="pi pi-pencil"
                severity="info"
                [text]="true"
                pTooltip="Editar"
                tooltipPosition="top"
                (onClick)="onEdit(brand)"
              ></p-button>

              <p-button
                [icon]="brand.isActive ? 'pi pi-eye-slash' : 'pi pi-eye'"
                severity="warn"
                [text]="true"
                [pTooltip]="brand.isActive ? 'Inactivar' : 'Activar'"
                tooltipPosition="top"
                (onClick)="onToggleStatus(brand)"
              ></p-button>

              <p-button
                icon="pi pi-trash"
                severity="danger"
                [text]="true"
                pTooltip="Eliminar"
                tooltipPosition="top"
                (onClick)="onDelete(brand)"
              ></p-button>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
