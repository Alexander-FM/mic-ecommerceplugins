<p-toast></p-toast>
<div class="my-orders-container">
  <h2><i class="pi pi-shopping-bag"></i> Mis Compras</h2>

  <p-card *ngIf="!isLoading && orders.length > 0">
    <p-table [value]="orders" [tableStyle]="{'min-width': '60rem'}" responsiveLayout="stack">
      <ng-template pTemplate="header">
        <tr>
          <th>Pedido</th>
          <th>Fecha</th>
          <th>Estado</th>
          <th>Total</th>
          <th>Observaciones</th>
          <th style="width: 120px; text-align: center;">Acciones</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-order>
        <tr>
          <td><strong>#{{ order.id }}</strong></td>
          <td>{{ order.orderDate | date:'dd/MM/yyyy hh:mm a' }}</td>
          <td>
            <p-tag [value]="order.orderStatusName" [severity]="getOrderStatusSeverity(order.orderStatusName)" [icon]="getOrderStatusIcon(order.orderStatusName)"></p-tag>
          </td>
          <td class="font-bold">{{ order.totalAmount | currency:'PEN':'symbol' }}</td>
          <td>{{ order.orderNotes }}</td>
          <td style="text-align: center;">
            <p-button icon="pi pi-eye" [rounded]="true" [text]="true" severity="info" (onClick)="viewDetail()" pTooltip="Ver detalle" tooltipPosition="top"></p-button>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </p-card>

  <div class="empty-state" *ngIf="!isLoading && orders.length === 0">
    <p-card>
      <div class="empty-content">
        <i class="pi pi-shopping-bag" style="font-size: 5rem; color: #ccc;"></i>
        <h3>No tienes compras registradas</h3>
        <p>Comienza explorando nuestros productos.</p>
        <p-button label="Ir a comprar" icon="pi pi-shopping-cart" (onClick)="continueShopping()"></p-button>
      </div>
    </p-card>
  </div>

  <div class="loading-state" *ngIf="isLoading">
    <div class="spinner-container">
      <i class="pi pi-spin pi-spinner" style="font-size: 3rem"></i>
      <p>Cargando tus compras...</p>
    </div>
  </div>
</div>
